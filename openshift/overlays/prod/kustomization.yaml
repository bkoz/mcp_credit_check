apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mcp-credit-report-prod

namePrefix: prod-

bases:
  - ../../base

secretGenerator:
  - name: equifax-credentials
    literals:
      - EQUIFAX_CLIENT_ID=your_production_equifax_client_id_here
      - EQUIFAX_CLIENT_SECRET=your_production_equifax_client_secret_here
  - name: github-token
    literals:
      - GITHUB_TOKEN=your_production_github_token_here

patchesStrategicMerge:
  - namespace.yaml
  - replica-patch.yaml
  - resource-patch.yaml

commonLabels:
  environment: prod
