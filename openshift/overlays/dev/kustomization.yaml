apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mcp-credit-report-dev

namePrefix: dev-

bases:
  - ../../base

# Secrets are managed separately - see secrets.yaml.template
# Copy secrets.yaml.template to secrets.yaml and fill in your credentials
resources:
  - secrets.yaml

patchesStrategicMerge:
  - namespace.yaml
  - replica-patch.yaml

commonLabels:
  environment: dev
