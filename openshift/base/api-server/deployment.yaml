apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: api-server
  template:
    metadata:
      labels:
        app.kubernetes.io/component: api-server
    spec:
      containers:
        - name: api-server
          image: image-registry.openshift-image-registry.svc:5000/mcp-credit-report/api-server:latest
          ports:
            - containerPort: 3002
              protocol: TCP
              name: http
          env:
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: GITHUB_TOKEN
            - name: MCP_SERVER_URL
              value: "http://mcp-server:3001/mcp"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            tcpSocket:
              port: 3002
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 5
