apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextjs
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: nextjs
  template:
    metadata:
      labels:
        app.kubernetes.io/component: nextjs
    spec:
      containers:
        - name: nextjs
          image: image-registry.openshift-image-registry.svc:5000/mcp-credit-report/nextjs:latest
          ports:
            - containerPort: 3000
              protocol: TCP
              name: http
          env:
            - name: API_SERVER_URL
              value: "http://api-server:3002"
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
