apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: nextjs
spec:
  source:
    type: Git
    git:
      uri: https://github.com/your-org/mcp_credit_check.git
      ref: main
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: nextjs:latest
  triggers:
    - type: ConfigChange
    - type: ImageChange
