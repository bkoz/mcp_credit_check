apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/component: mcp-server
    spec:
      containers:
        - name: mcp-server
          image: image-registry.openshift-image-registry.svc:5000/mcp-credit-report/mcp-server:latest
          ports:
            - containerPort: 3001
              protocol: TCP
              name: http
          env:
            - name: EQUIFAX_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: equifax-credentials
                  key: EQUIFAX_CLIENT_ID
            - name: EQUIFAX_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: equifax-credentials
                  key: EQUIFAX_CLIENT_SECRET
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /mcp
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /mcp
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
